[package]
name = "weaver"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
async-openai = "0.30.1"
bpaf = { version = "0.9.20", features = [
  "owo-colors",
  "batteries",
  "bright-color",
] }
bitflags = "2.6.0"
grep-regex = "0.1.14"
grep-searcher = { version = "0.1.16", features = ["avx-accel", "simd-accel"] }
ignore = "0.4"
kameo = "0.19.2"
kameo_actors = "0.4.0"
pathdiff = "0.2.3"
rerun = "0.27.2"
schemars = { version = "1.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
  "chrono",
  "env-filter",
  "fmt",
  "local-time",
  "once_cell",
  "parking_lot",
] }
rand = "0.9"
uuid = { version = "1.18.1", package = "uuid", features = ["serde", "v4"] }
walkdir = "2.5.0"
async-trait = "0.1.89"
futures = "0.3.31"
bon = "3.8.1"
once_cell = "1.21.3"
parking_lot = "0.12"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
petgraph = { version = "0.8.3", features = ["all", "serde-1"] }
rayon = "1.10"
kameo-persistence = "0.1.0"
foyer = { version = "0.20.1", features = ["tracing", "serde", "nightly"] }
url = "2.5"
state = "0.6.0"
dashmap = "6.1.0"

[dev-dependencies]
proptest = "1.5"
postcard = "1.0"

[patch.crates-io]
kameo-persistence = { path = "vendor/kameo-persistence" }
